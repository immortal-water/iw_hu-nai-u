<!-- 有 JS 时先播开场动画再显示校区；没有 JS 时直接显示三个校区 -->
<script>document.documentElement.classList.add('js')</script>
<style>
  :root {
    --bg: #fff8f5;
    --fg: #4a3038;
    --muted: #9c8189;
    --ink: #f6b3c6;
    --ink-2: #f6e3a1;
    --ink-3: #bcd9ea;
    --track: rgba(246, 179, 198, .3);
    --card: #ffffff;
    --size: min(64vw, 44vh, 340px);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1416;
      --fg: #f7e8ec;
      --muted: #b09aa1;
      --track: rgba(246, 179, 198, .18);
      --card: #241c1f;
    }
  }

  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 24px 16px 56px;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body.choosing { cursor: default; }
  html:not(.js) main { display: none; }
  main {
    display: flex; flex-direction: column; align-items: center; gap: 32px; text-align: center;
    transition: opacity .45s ease-in, transform .45s ease-in;
  }
  .choosing main { opacity: 0; transform: scale(1.08); pointer-events: none; }

  /* 开场：旋转文字环 + 不转的中心奶娃（洋娃娃风，背景已透明），外面一圈进度条 */
  .badge { position: relative; width: var(--size); aspect-ratio: 1; }
  .badge img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .progress { position: absolute; inset: -5.5%; width: 111%; height: 111%; transform: rotate(-90deg); overflow: visible; }
  .progress circle { fill: none; stroke-width: 1.1; stroke-linecap: round; }
  .progress .track { stroke: var(--track); }
  .progress .bar { stroke: var(--ink); stroke-dasharray: 100; stroke-dashoffset: 100; }

  .copy { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  h1 { font-size: clamp(26px, 7vw, 40px); font-weight: 800; letter-spacing: .12em; padding-left: .12em; }
  .status { font-size: clamp(14px, 4vw, 17px); }
  .dots i {
    display: inline-block; width: .3em; height: .3em; margin-left: .18em;
    border-radius: 50%; background: currentColor; vertical-align: middle;
    animation: dot 1s ease-in-out infinite;
  }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  .hint { font-size: 13px; color: var(--muted); }

  /* 选校区：从屏幕中心出发、两两夹角 90° 的四条射线把屏幕分成四块，整个「转盘」缓慢旋转。
     每块是一个铺满全屏的链接，用 clip-path 裁成扇形（顶点伸到 150vmax 外，转到任何角度、任何屏幕比例都能盖满），
     裁掉的部分也不响应点击。截图和标签做等速反向旋转，看起来不动，像四扇窗户绕着中心转。
     旋转都用 rotate/scale/translate 独立属性，才能和 hover、离场的缩放叠加。0.7071 = cos 45°。 */
  /* --spin-at（0~1）由脚本每次开场随机设置：所有旋转动画用同一个负延迟，从随机角度开始且保持同步 */
  .sectors { --period: 160s; --spin-delay: calc(var(--period) * var(--spin-at, 0) * -1); position: fixed; inset: 0; z-index: 1; overflow: hidden; background: #1a1416; }
  .js .sectors { opacity: 0; visibility: hidden; transition: opacity .6s ease .2s, visibility 0s .8s; }
  .choosing .sectors { opacity: 1; visibility: visible; transition: opacity .6s ease .2s, visibility 0s; }
  .wheel { position: absolute; inset: 0; }
  .choosing .wheel { animation: spin var(--period) linear var(--spin-delay) infinite; }
  .sector { position: absolute; inset: 0; color: #fff; text-decoration: none; cursor: pointer; outline: none; }
  .sector.top    { clip-path: polygon(50% 50%, calc(50% - 106.07vmax) calc(50% - 106.07vmax), 50% calc(50% - 150vmax), calc(50% + 106.07vmax) calc(50% - 106.07vmax)); }
  .sector.right  { clip-path: polygon(50% 50%, calc(50% + 106.07vmax) calc(50% - 106.07vmax), calc(50% + 150vmax) 50%, calc(50% + 106.07vmax) calc(50% + 106.07vmax)); }
  .sector.bottom { clip-path: polygon(50% 50%, calc(50% + 106.07vmax) calc(50% + 106.07vmax), 50% calc(50% + 150vmax), calc(50% - 106.07vmax) calc(50% + 106.07vmax)); }
  .sector.left   { clip-path: polygon(50% 50%, calc(50% - 106.07vmax) calc(50% + 106.07vmax), calc(50% - 150vmax) 50%, calc(50% - 106.07vmax) calc(50% - 106.07vmax)); }

  /* 截图铺满全屏、反向旋转保持不动；扇区转到哪里就透出哪里 */
  .sector img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    filter: brightness(.78); transition: filter .35s, scale .9s cubic-bezier(.2, .7, .2, 1);
  }
  .sector.top img    { object-position: center top; }
  .sector.left img   { object-position: left top; }
  .sector.right img  { object-position: center top; }
  .sector.bottom img { object-position: center bottom; }
  .js .sector img { scale: 1.08; }
  .choosing .sector img { scale: 1; animation: unspin var(--period) linear var(--spin-delay) infinite; }
  .sector:hover img, .sector:focus-visible img { filter: none; scale: 1.03; }
  .sectors:hover .sector:not(:hover) img { filter: brightness(.5) saturate(.7); }

  /* 标签放在扇区中线上、离中心 --d，跟着转盘绕中心公转，同时反向自转保持正立。
     四个标签两两只隔 90°，所以字号和留白都比三扇区时收了一点，免得窄屏上撞在一起 */
  .sector-label {
    --d: 27vmin;
    position: absolute; translate: -50% -50%;
    padding: 9px 14px; border-radius: 14px; text-align: center; white-space: nowrap;
    background: rgba(26, 20, 22, .62); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    transition: background-color .25s, color .25s, scale .25s;
  }
  .choosing .sector-label { animation: unspin var(--period) linear var(--spin-delay) infinite; }
  .sector-label small { display: block; font-size: clamp(11px, 1vw, 14px); letter-spacing: .08em; opacity: .8; }
  .sector-label b { display: block; font-size: clamp(15px, 2.6vw, 34px); letter-spacing: .1em; }
  .sector.top .sector-label    { left: 50%; top: calc(50% - var(--d)); }
  .sector.right .sector-label  { left: calc(50% + var(--d)); top: 50%; }
  .sector.bottom .sector-label { left: 50%; top: calc(50% + var(--d)); }
  .sector.left .sector-label   { left: calc(50% - var(--d)); top: 50%; }
  .sector:hover .sector-label, .sector:focus-visible .sector-label, .sector.picked .sector-label {
    background: var(--ink); color: #4a3038; scale: 1.06;
  }

  .ray {
    position: absolute; left: 50%; top: 50%; width: 150vmax; height: 4px; margin-top: -2px;
    background: var(--ink); box-shadow: 0 0 10px rgba(0, 0, 0, .45);
    transform-origin: 0 50%; transform: rotate(var(--a)); pointer-events: none;
  }
  .js .ray { transform: rotate(var(--a)) scaleX(0); }
  .choosing .ray { animation: ray .7s cubic-bezier(.2, .7, .2, 1) .3s forwards; }
  /* 中心圆盘：边框用婴儿蓝，中心图用奶娃（core.png，背景已透明） */
  .hub {
    position: absolute; left: 50%; top: 50%; width: clamp(64px, 11vmin, 96px); aspect-ratio: 1;
    border: 4px solid var(--ink-3); border-radius: 50%; pointer-events: none;
    background: #fff url(./resource/core.png) center / 150% no-repeat; box-shadow: 0 6px 24px rgba(0, 0, 0, .4);
    transform: translate(-50%, -50%);
  }
  .js .hub { transform: translate(-50%, -50%) scale(0); }
  .choosing .hub { animation: hub .5s cubic-bezier(.34, 1.56, .64, 1) .2s forwards; }

  /* 选中后：其他两块淡出，选中的那块放大，然后跳转 */
  .sector { transition: opacity .35s; }
  .leaving .sector:not(.picked), .leaving .ray, .leaving .hub { opacity: 0; transition: opacity .35s; }
  .leaving .sector.picked img { filter: none; scale: 1.1; }

  /* 右下角「关于」：开场阶段打开时暂停倒计时 */
  .about-btn {
    position: fixed; z-index: 2; right: max(8px, env(safe-area-inset-right)); bottom: max(8px, env(safe-area-inset-bottom));
    padding: 8px 10px; border: 0; border-radius: 999px; background: none; color: var(--muted);
    font: inherit; font-size: 13px; cursor: pointer;
    text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px;
    transition: color .2s, background-color .2s, text-decoration-color .2s, opacity .3s;
  }
  .about-btn:hover, .about-btn:focus-visible { color: var(--fg); text-decoration-color: currentColor; }
  .choosing .about-btn { padding: 6px 14px; background: rgba(26, 20, 22, .6); color: #fff; }
  .leaving .about-btn { opacity: 0; }

  /* 左上角「奶龙博物馆」入口：一块洋娃娃配色的方块，转到选校区时变成深色胶囊 */
  .museum-btn {
    position: fixed; z-index: 2; left: max(8px, env(safe-area-inset-left)); top: max(8px, env(safe-area-inset-top));
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 12px 8px 9px; border-radius: 999px;
    color: var(--muted); font-size: 13px; letter-spacing: .04em; text-decoration: none;
    transition: color .2s, background-color .2s, opacity .3s;
  }
  .museum-btn .cube { width: 17px; height: 17px; flex: none; }
  .museum-btn:hover, .museum-btn:focus-visible { color: var(--fg); background: var(--track); }
  .choosing .museum-btn {
    padding: 6px 14px 6px 11px; background: rgba(26, 20, 22, .6); color: #fff;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .choosing .museum-btn:hover, .choosing .museum-btn:focus-visible { background: rgba(26, 20, 22, .8); color: #fff; }
  .leaving .museum-btn { opacity: 0; }
  .about {
    width: min(360px, calc(100vw - 32px)); margin: auto; padding: 0; border: 0; border-radius: 16px;
    background: var(--card); color: var(--fg); box-shadow: 0 18px 50px rgba(0, 0, 0, .25);
    cursor: auto; user-select: text;
  }
  .about[open] { animation: rise .25s ease-out; }
  .about::backdrop { background: rgba(26, 20, 22, .45); backdrop-filter: blur(3px); }
  .about-body { padding: 24px 22px 18px; }
  .about h2 { font-size: 18px; margin-bottom: 12px; }
  .about p { font-size: 14px; line-height: 1.7; }
  .about p + p { margin-top: 8px; }
  .about del { color: var(--muted); text-decoration-thickness: 4px; }
  .about a { color: var(--fg); font-weight: 700; text-underline-offset: 3px; }
  .about code {
    padding: 1px 6px; border-radius: 6px; background: var(--track);
    font: inherit; font-weight: 700; white-space: nowrap;
  }
  .about form { margin-top: 18px; text-align: right; }
  .about form button {
    padding: 8px 18px; border: 0; border-radius: 999px; background: var(--ink-2); color: #4a3038;
    font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
  }

  .run .badge { animation: pop .7s cubic-bezier(.34, 1.56, .64, 1) backwards; }
  .run .core { animation: breathe 1.8s ease-in-out .7s infinite; }
  .run .bar { animation: fill var(--delay) linear forwards; }
  .run .copy { animation: rise .5s ease-out .15s backwards; }
  .paused .bar { animation-play-state: paused; }

  @keyframes pop { from { transform: scale(.55) rotate(-25deg); opacity: 0; } }
  @keyframes breathe { 50% { transform: scale(1.03); } }
  @keyframes fill { to { stroke-dashoffset: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  @keyframes dot { 0%, 100% { opacity: .25; transform: none; } 40% { opacity: 1; transform: translateY(-.25em); } }
  @keyframes ray { to { transform: rotate(var(--a)) scaleX(1); } }
  @keyframes hub { to { transform: translate(-50%, -50%) scale(1); } }
  @keyframes spin { to { rotate: 360deg; } }
  @keyframes unspin { to { rotate: -360deg; } }

  @media (prefers-reduced-motion: reduce) {
    .run .badge, .run .core, .run .copy, .dots i, .about[open] { animation: none; }
    .choosing .ray { animation: none; transform: rotate(var(--a)); }
    .choosing .hub { animation: none; transform: translate(-50%, -50%); }
    main, .sectors, .sector, .sector img, .sector-label { transition: none !important; }
    /* 不转，但保留动画并暂停：带着随机负延迟停住，就是一个随机的静止角度 */
    .choosing .wheel, .choosing .sector img, .choosing .sector-label { animation-play-state: paused; }
    .js .sector img, .sector:hover img, .leaving .sector.picked img { scale: none; }
  }
</style>
</head>
<body class="run choosing" style="--delay: 2600ms;">
<main>
  <div class="wrap" aria-hidden="true">

  <svg class="cube" viewBox="0 0 24 24" aria-hidden="true">

<script>
(() => {
  const stay = new URLSearchParams(location.search).has('stay'); // 演示用：选了校区也不跳转，重新播放
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DELAY = reduce ? 1200 : 2600; // 进度条走满的时间，之后切到选校区（ms）
  const EXIT = reduce ? 0 : 450;      // 选中扇区后的离场动画时长（ms）
  const SPIN = 4000;                  // 文字环转一圈（ms）
  const CLICK_GUARD = 350;            // 扇区刚出现时忽略点击，免得「跳过动画」的那一下直接点进某个校区

  const body = document.body;
  body.style.setProperty('--delay', DELAY + 'ms');
  if (stay) document.getElementById('hint').textContent += '（演示模式，不会真的跳转）';

  const ring = reduce ? null : document.querySelector('.ring').animate(
    [{ transform: 'rotate(0turn)' }, { transform: 'rotate(1turn)' }],
    { duration: SPIN, iterations: Infinity }
  );

  const sectorsNav = document.querySelector('.sectors');
  const sectors = [...document.querySelectorAll('.sector')];
  const aboutBtn = document.getElementById('about-btn');
  const about = document.getElementById('about');
  const museumBtn = document.getElementById('museum-btn');
  aboutBtn.hidden = false; // 没有 JS 时弹窗打不开，按钮也就不显示

  let state, timer, deadline, remaining, chooseAt = 0; // state: intro → choosing → leaving

  function arm(ms) {
    deadline = performance.now() + ms;
    timer = setTimeout(choose, ms);
  }

  function start() {
    state = 'intro';
    body.classList.remove('run', 'choosing', 'leaving', 'paused');
    sectors.forEach(a => a.classList.remove('picked'));
    sectorsNav.style.setProperty('--spin-at', Math.random().toFixed(4)); // 转盘的随机初始角度
    void body.offsetWidth; // 重新触发 CSS 动画
    body.classList.add('run');
    if (ring) ring.play();
    arm(DELAY);
  }

  function choose(viaKey) {
    if (state !== 'intro') return;
    state = 'choosing';
    clearTimeout(timer);
    chooseAt = performance.now();
    body.classList.add('choosing');
    if (ring) setTimeout(() => state !== 'intro' && ring.pause(), 500); // 开场淡出后就不用再转了
    if (viaKey === true) sectors[0].focus();
  }

  function leave(link) {
    state = 'leaving';
    link.classList.add('picked');
    body.classList.add('leaving');
    setTimeout(stay ? start : () => { location.href = link.href; }, stay ? EXIT + 600 : EXIT);
  }

  sectors.forEach(a => a.addEventListener('click', e => {
    if (e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0) return; // 新标签页打开等交给浏览器
    e.preventDefault();
    if (state !== 'choosing' || performance.now() - chooseAt < CLICK_GUARD) return;
    leave(a);
  }));

  // 从校区网站点「返回」时页面可能是从缓存恢复的，直接回到选校区界面
  addEventListener('pageshow', e => {
    if (!e.persisted || state !== 'leaving') return;
    state = 'choosing';
    body.classList.remove('leaving');
    sectors.forEach(a => a.classList.remove('picked'));
  });

  // 开场阶段打开「关于」时暂停倒计时和进度条，关闭后从剩余时间继续
  aboutBtn.addEventListener('click', () => {
    if (state === 'leaving') return;
    if (state === 'intro') {
      clearTimeout(timer);
      remaining = Math.max(0, deadline - performance.now());
      body.classList.add('paused');
    }
    about.showModal();
  });
  about.addEventListener('close', () => {
    if (!body.classList.contains('paused')) return;
    body.classList.remove('paused');
    if (state === 'intro') arm(remaining);
  });
  about.addEventListener('click', e => { if (e.target === about) about.close(); }); // 点遮罩关闭

  // 开场阶段点击或按键直接切到选校区；「关于」「奶龙博物馆」的操作和 Tab、修饰键除外
  const IGNORED_KEYS = ['Tab', 'Shift', 'Control', 'Alt', 'Meta'];
  function skip(e) {
    if (state !== 'intro' || about.open) return;
    if (aboutBtn.contains(e.target) || museumBtn.contains(e.target)) return;
    if (e.type === 'keydown' && IGNORED_KEYS.includes(e.key)) return;
    choose(e.type === 'keydown');
  }
  addEventListener('pointerdown', skip);
  addEventListener('keydown', skip);
  start();
})();
</script>
</body></html>
